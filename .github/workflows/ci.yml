name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # Changed to macos-latest for Apple Silicon

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Set up Signing Files
      run: |
        mkdir -p .secret
        echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./.secret/my-release-key.jks
        echo "storeFile=./.secret/my-release-key.jks" > ./.secret/signing.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> ./.secret/signing.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./.secret/signing.properties
        echo "keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}" >> ./.secret/signing.properties
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}

    # Consolidated Lint and Unit Tests step
    - name: Run Static Analysis and Unit Tests
      run: ./gradlew lintDebug testDebugUnitTest

    # Prevents "Unable to connect to adb daemon on port: 5037"
    - name: Force Start ADB
      run: |
        adb kill-server
        adb start-server

    - name: Run Instrumented Tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis 
        arch: arm64-v8a # Changed to arm64-v8a for Apple Silicon
        profile: pixel_6
        disable-animations: true
        disable-spellchecker: true
        emulator-options: >-
          -no-window
          -gpu host
          -noaudio
          -no-boot-anim
          -no-snapshot-load
        emulator-boot-timeout: 900
        script: ./gradlew connectedCheck
      env: # CRITICAL FIX: Forces the emulator to use bundled libraries
        ANDROID_EMULATOR_USE_SYSTEM_LIBS: 1

    - name: Build Debug APK
      run: ./gradlew assembleDebug