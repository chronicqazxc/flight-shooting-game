name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel # UPDATED: macos-13 is retired. Use macos-15-intel for x86_64 emulator support.

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Set up Signing Files
      run: |
        mkdir -p .secret
        echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./.secret/my-release-key.jks
        echo "storeFile=./.secret/my-release-key.jks" > ./.secret/signing.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> ./.secret/signing.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./.secret/signing.properties
        echo "keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}" >> ./.secret/signing.properties
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}

    # Consolidated Lint and Unit Tests step
    - name: Run Static Analysis and Unit Tests
      run: ./gradlew lintDebug testDebugUnitTest

    # Optional: Pre-start ADB to prevent daemon connection issues
    - name: Start ADB Server
      run: adb kill-server && adb start-server # Updated for more aggressive ADB reset

    - name: Run Instrumented Tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 30
        target: google_apis 
        arch: x86_64
        profile: pixel_6
        disable-animations: true
        disable-spellchecker: true
        # UPDATED for macos-15-intel stability in 2025:
        # 1. Use swiftshader_indirect to bypass macOS 15 host GPU driver hangs.
        # 2. Add -no-snapshot-load to ensure a clean boot.
        # 3. Add -no-window and -noaudio as standard CI flags.
        emulator-options: >-
          -no-window
          -gpu swiftshader_indirect
          -noaudio
          -no-boot-anim
          -no-snapshot-load
          -memory 3072 # Increased memory
          -camera-back none # Disable virtual cameras
          -camera-front none # Disable virtual cameras
        # Increased timeout to handle slow macOS 15 Intel virtualization
        emulator-boot-timeout: 900
        script: ./gradlew connectedCheck

    - name: Build Debug APK
      run: ./gradlew assembleDebug