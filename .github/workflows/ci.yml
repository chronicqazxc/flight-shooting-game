name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # macos-15-intel is currently slower than previous versions; ensure sufficient timeouts.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Signing Files
        run: |
          mkdir -p .secret
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./.secret/my-release-key.jks
          echo "storeFile=./.secret/my-release-key.jks" > ./.secret/signing.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> ./.secret/signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./.secret/signing.properties
          echo "keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}" >> ./.secret/signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}

      - name: Run Static Analysis and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Force Start ADB
        run: |
          adb kill-server
          adb start-server

      - name: Run Instrumented Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          # FIX: Switched to -gpu host for better stability on Intel macOS.
          # Removed -feature -Vulkan as it can sometimes conflict with API 30's default behavior.
          emulator-options: >-
            -no-window
            -gpu host
            -noaudio
            -no-boot-anim
            -no-snapshot-load
            -memory 3072
            -camera-back none
            -camera-front none
          # FIX: Increased timeout to 30 minutes (1800s) to account for macos-15-intel performance.
          emulator-boot-timeout: 1800
          script: ./gradlew connectedCheck
        # FIX: Removed ANDROID_EMULATOR_USE_SYSTEM_LIBS: 1.
        # On macOS 15, forcing system libs often causes the dylib loading hang you experienced.

      - name: Build Debug APK
        run: ./gradlew assembleDebug
