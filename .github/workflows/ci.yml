name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest # Changed to macos-latest for HAXM acceleration

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 29 # Changed to 29
        build-tools-version: 31.0.0 # Match API level
        # Other parameters like sdk-extra-packages, etc., can be added if needed

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Set up Signing Files
      run: |
        mkdir -p .secret
        echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 --decode > ./.secret/my-release-key.jks
        echo "storeFile=./.secret/my-release-key.jks" > ./.secret/signing.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> ./.secret/signing.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> ./.secret/signing.properties
        echo "keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}" >> ./.secret/signing.properties
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}

    - name: Run Lint
      run: ./gradlew lintDebug
    
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Run Instrumented Tests # Combined emulator start and test run
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 30       # Change from 29 to 30+
        target: google_apis 
        arch: arm64-v8a    # Keep as arm64-v8a for M1/M2 runners
        profile: pixel_6    # Use a more modern profile
        # disable-animations: true # Keep for potential test flakiness
        script: ./gradlew connectedCheck # Run instrumented tests here

    - name: Build Debug APK
      run: ./gradlew assembleDebug